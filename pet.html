<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    pointer-events: none;
    user-select: none;
  }
  #pet {
    position: absolute;
    font-size: 40px;
    line-height: 1;
    will-change: transform;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
  }
  #zzz {
    position: absolute;
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.4s;
  }
</style>
</head>
<body>
  <div id="pet">🐶</div>
  <div id="zzz">💤</div>
  <script src="pet.js"></script>
</body>
</html>

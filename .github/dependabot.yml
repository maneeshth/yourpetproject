version: 2
updates:
  # Keep Electron / electron-builder patched (Chromium security fixes ship via Electron).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keep the GitHub Actions used in workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

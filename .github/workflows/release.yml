name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npx electron-builder --publish never
        env:
          # Do not attempt to code-sign on macOS (no certificate in CI).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: installers
        run: |
          sha256sum *.dmg *.exe *.AppImage > SHA256SUMS
          echo "::group::SHA256SUMS"
          cat SHA256SUMS
          echo "::endgroup::"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/*.dmg
            installers/*.exe
            installers/*.AppImage
            installers/SHA256SUMS
          fail_on_unmatched_files: true
          body: |
            Unsigned builds — see the README's **Installation notes** for the
            macOS Gatekeeper / Windows SmartScreen steps. Verify your download
            against `SHA256SUMS` before installing.
